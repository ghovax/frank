# XEAC — every setting, with what it is for and what it ships at.

# GENERATED by scripts/generate_configuration_reference.py from the configuration schema. Edit
# the `Field(description=...)` beside a setting, or the `Default(...)` beside a tunable, and
# regenerate — an edit made here is overwritten.

# This is a REFERENCE, not a starting point. Copying it wholesale would pin every value to this
# release's defaults, so a later release could never move any of them. The file XEAC creates at
# ~/.config/xeac/configuration.yaml stays short on purpose, holding only what you changed.

# `xeac configure --all` prints the same information from the running code, with what YOUR
# machine is currently set to alongside each default. `xeac configure <path>` reads one setting
# and `xeac configure <path> <value>` writes it. A name this file does not list is refused
# rather than written and ignored.

# Credentials can also come from the environment, which wins over anything written here — so a
# secret never has to be on disk. NEVER commit a filled-in copy of this file.

# Credentials per model provider, keyed by provider name — anthropic, openai, google, openrouter,
# xai and the rest; xeac.base.providers holds the full list with each one's environment variable.
# Which model a session runs is chosen by its agent profile, so nothing here nominates one.
# Keys here are your own names; there is no fixed set.
providers: {}

# The web-search backend.
exa:
  # Exa API key. The EXA_API_KEY environment variable wins over this.
  api_key: ''

# The default page-fetching engine.
jina:
  # Jina API key, which raises the rate limit. JINA_API_KEY wins over this.
  api_key: ''

# The fallback page-fetching engine.
firecrawl:
  # Firecrawl API key. FIRECRAWL_API_KEY wins over this.
  api_key: ''
  # A self-hosted Firecrawl instance to use instead of the hosted API.
  api_url: ''

# Fetching a page directly.
web_fetch:
  # Route direct fetches and file downloads through an HTTP or SOCKS proxy, for sites that block
  # by address. Empty fetches directly. Credentials may be embedded as http://user:pass@host:port.
  proxy_url: ''

# What a session's tool children may do, enforced by the operating system.
sandbox:
  # What to do where no backend can enforce this. required refuses to create the session and says
  # what is missing; preferred runs with resource limits only and says so; off does not confine at
  # all.
  enforce: required
  # Which paths a tool child may read and write.
  filesystem:
    # Paths under your home a tool child may read. The system is readable and is not listed.
    readable:
      - ~/.config
      - ~/.local
      - ~/.ssh
      - ~/.gitconfig
      - ~/.gitignore_global
      - ~/.cargo
      - ~/.rustup
      - ~/.npmrc
      - ~/.nvm
      - ~/.pyenv
      - ~/.docker
      - ~/.netrc
    # Paths a tool child may write. Deliberately narrower than readable, because a wrong write is
    # the failure people actually meet. $WORKSPACE is the session's own directory.
    writable:
      - $WORKSPACE
      - $TMPDIR
      - $XDG_CACHE_HOME
      - ~/.cache
    # Paths refused outright. Wins over readable and writable.
    deny:
      - ~/Documents
      - ~/Desktop
      - ~/Downloads
      - ~/Pictures
      - ~/Movies
      - ~/Music
      - ~/Library/Mail
      - ~/Library/Messages
      - ~/Library/Safari
  # Whether a tool child may reach the network at all.
  network: true
  # POSIX resource limits, by their setrlimit(2) names and in that call's own units.
  limits:
    RLIMIT_CORE: 0
    RLIMIT_FSIZE: 8589934592
    RLIMIT_NPROC: 2048
  # Octal umask for tool children, as a string such as "0077". Null leaves it alone.
  umask: null
  # Scheduling priority for tool children, as nice(2) takes it.
  nice: 0

# How the daemon manages worker processes.
daemon:
  # Blank workers kept parked, so creating a session is a socket write rather than a Python cold
  # start. Small because a warm worker costs real memory.
  warm_floor: 2
  # The point past which the daemon stops pre-warming, counting warm and assigned workers
  # together. It bounds pre-warming rather than sessions: a claim against an empty pool spawns on
  # demand and never consults this, so a wide fan-out is always served — it just pays a cold start
  # per child past the spares.
  warm_ceiling: 8

# Where a session's tools run.
workspace:
  # none runs in the project directory itself; branch gives each session its own branch; worktree
  # gives each session its own git worktree, so parallel sessions never tread on each other.
  strategy: none
  # Writes larger than this are recorded as a placeholder version rather than stored, since
  # artifact versioning keeps the files the agent writes.
  artifact_maximum_bytes: 134217728

# How conversation history is folded as it grows.
compaction:
  # Fold history automatically as it grows. Manual compaction works either way.
  auto: true
  # Run the Observer once live context passes this share of the window.
  observer_context_fraction: 0.6
  # Run the Reflector once the observation log itself passes this share.
  reflector_observation_fraction: 0.3
  # Recent turns always kept verbatim, never folded into observations.
  keep_recent_turns: 6

# Whether the system prompt describes how you work on this machine.
user_context:
  # Put a snapshot of how you work — frequent folders, applications, sites — in the system prompt.
  # Off by default: it puts personally identifying information in front of your model provider.
  enabled: false

# Driving the screen.
computer_control:
  # Let the agent drive native macOS apps and your Chrome.
  enabled: false
  # How long a screen surface is given to stop changing after an action.
  settle:
    # How often to re-check whether the surface has settled.
    poll_seconds: 0.05
    # The longest to wait before reading it anyway.
    give_up_seconds: 1.5

# How large, how many, and how patient the tools are.
tuning:
  # What proportion of the live context window one result may fill.
  context_share:
    # Share one result's text may fill — output, fetched pages.
    text: 0.25
    # Share a set of results may fill — matches, lines, records.
    results: 0.15
  # Multiplier on every wait. 2.0 doubles them for a slow machine; 1.0 is neutral.
  timeout_multiplier: 1.0
  # Override one tunable by its own name, in its own unit — see `xeac configure --all`. An
  # override replaces the shipped default, so context_share and timeout_multiplier still apply on
  # top.
  defaults:
    # Tokens of inline output one tool may return before the rest overflows to a file.
    output_tokens: 16000
    # Tokens of a fetched web page's text kept inline.
    fetch_tokens: 24000
    # Characters of a single over-long line kept before it is clipped, so one minified blob cannot
    # fill a result on its own.
    maximum_line_chars: 2048
    # Lines a file read returns when no explicit limit is given.
    read_lines: 2000
    # Total matches one search returns.
    grep_results: 512
    # Matches one search returns from any single file.
    grep_per_file: 512
    # Paths one glob returns.
    glob_results: 1000
    # Ceiling on the result count a web search may ask for, however many it requests.
    web_search_maximum: 10
    # Paths listed on a remote machine before glob matching is applied locally.
    remote_listing: 32768
    # Recent request/response pairs a browser session keeps, so a search can surface the API
    # behind a rendered view.
    web_exchanges: 250
    # Live websockets a browser session tracks at once.
    web_websockets: 32
    # Frames retained per tracked websocket.
    web_websocket_frames: 200
    # How long one browser action (click, type, hover) waits for its element.
    action_timeout_ms: 5000
    # How long a page load or navigation waits.
    navigation_timeout_ms: 20000
    # How long an accessibility snapshot of a page waits.
    snapshot_timeout_ms: 10000
    # How long attaching to a browser waits.
    connect_timeout_ms: 10000
    # How long a drag between two elements waits.
    drag_timeout_ms: 8000
    # How long capturing a page screenshot waits.
    screenshot_timeout_ms: 20000
    # How long reading a page's text waits.
    read_text_timeout_ms: 10000
    # How long resolving a frame reference waits. Deliberately well below the action timeout: a
    # frame that has gone waits out its budget rather than erroring, and listing every frame would
    # otherwise stall on the one that left.
    frame_resolve_timeout_ms: 2000
    # How long a cancelled command or a reaped session has after SIGTERM before SIGKILL.
    sigterm_grace_seconds: 3.0
    # How long one content search may run.
    ripgrep_seconds: 30.0
    # How long a shell command runs inline before it moves to the background. It is not killed at
    # this point, only handed off, and the model can override it per call.
    bash_sync_window_seconds: 60.0
    # The same inline window for fetching a URL or downloading a file.
    slow_tool_sync_window_seconds: 10.0
    # The same inline window for a web search.
    web_search_sync_window_seconds: 10.0
    # How long one accessibility message to an application waits, so a hung application costs a
    # moment rather than the whole action.
    ax_messaging_seconds: 2.0
    # How long the daemon waits for a fresh worker to start.
    worker_ready_seconds: 60.0
    # How long the daemon waits for a worker to accept its assignment and open its socket.
    worker_assignment_seconds: 60.0
    # How long a command waits for a daemon it just started to become reachable.
    daemon_startup_seconds: 45.0
    # How long one call to the daemon waits.
    control_plane_call_seconds: 60.0
    # How long the list of available models is cached.
    model_catalogue_ttl_seconds: 60.0
    # How far ahead of its expiry an access token is refreshed.
    credential_refresh_leeway_seconds: 300.0
    # How long a signed file URL stays valid.
    file_url_ttl_seconds: 600.0
    # How long connecting to one MCP server waits.
    mcp_connect_seconds: 20.0
    # How long fetching a remote agent's card waits.
    card_resolve_seconds: 20.0
    # How long a command on another machine may run.
    remote_command_seconds: 120.0
    # How long opening an SSH connection waits.
    remote_connect_seconds: 16.0
    # How long a shared SSH connection lingers after its last use, so the next command reuses it.
    remote_control_persist_seconds: 120.0
    # How long one screen-control script may run.
    control_script_seconds: 120.0
    # How far above the script's own limit the machinery waiting on it sits, so raising that limit
    # can never make the guard fire first and leave the surface half-dead.
    surface_guard_margin_seconds: 30.0
    # How long capturing the screen waits.
    screencapture_seconds: 15.0
    # How long handing a URL to the system browser waits.
    open_url_seconds: 5.0
    # Characters sent per synthesized keyboard event.
    type_chunk_size: 20
    # Segments a drag is split into, so it looks like a hand moved it.
    drag_steps: 12
    # Pixels one scroll step moves a native window.
    scroll_amount_pixels: 300
    # Identical consecutive reads that count a surface as having stopped changing.
    settle_stable_reads: 2
    # Pause between successive synthesized clicks.
    click_interval_seconds: 0.01
    # Pause between the interpolated steps of a drag.
    drag_step_interval_seconds: 0.01
    # Pause between typed chunks.
    type_chunk_interval_seconds: 0.005
    # Pause after focusing a field, before typing into it.
    focus_settle_seconds: 0.03
    # Longest side, in pixels, of a screenshot annotated with element labels.
    stamped_image_side: 2048
    # How deep an accessibility overview of a window walks.
    ax_overview_depth: 4
    # How deep the cheap probe walks that asks whether an application's accessibility tree exists
    # yet.
    ax_ready_probe_depth: 2
    # Pause between pre-warming the frontmost application's accessibility tree.
    ax_prewarm_interval_seconds: 0.4
    # Ceiling on the widening pause between accessibility readiness probes.
    ax_ready_backoff_seconds: 0.2

# Composio's hosted MCP gateway.
composio:
  # Expose Composio's hosted gateway as one MCP server.
  enabled: false
  # The hosted MCP URL from the Composio dashboard's "connect" page.
  url: https://connect.composio.dev/mcp
  # The API key shown beside that URL. COMPOSIO_API_KEY wins over this.
  api_key: ''
  # The MCP server name its tools appear under.
  server_name: composio
  # How long one call to that gateway waits.
  timeout_seconds: 60

# MCP servers, read from mcp.json.
mcp:
  # Declared MCP servers, by name. Read from mcp.json, not from this file.
  # Keys here are your own names; there is no fixed set.
  servers: {}

# Agents on other hosts, read from remote-agents.json.
remote_agents:
  # Registered remote agents, by name. Read from remote-agents.json, not from this file.
  # Keys here are your own names; there is no fixed set.
  agents: {}

# Inbound authentication, for a daemon other machines can reach.
a2a:
  # Shared secret an inbound request must carry. ${VARIABLE} is expanded from the environment at
  # load, so the secret need not live in the file.
  api_key: ''
  # The header that secret is read from.
  api_key_header: X-API-Key
  # When set, an inbound bearer JWT is validated against this key set.
  oauth2_jwks_url: ''
  # The issuer an inbound JWT must claim.
  oauth2_issuer: ''
  # The audience an inbound JWT must claim.
  oauth2_audience: ''

# OpenTelemetry export.
telemetry:
  # Export traces at all.
  enabled: false
  # Where traces are sent.
  exporter:
    # The OTLP collector to export to. Empty exports nothing.
    endpoint: ''
    # The OTLP protocol that collector speaks.
    protocol: http/protobuf
    # Headers sent with each export, for a collector that authenticates. ${VARIABLE} is expanded.
    headers: {}
  # Share of traces exported. 1.0 exports every one.
  sample_ratio: 1.0

# What a session runs under when its creator does not say. An agent profile that declares its own
# stricter mode still wins: this is a floor for sessions created without one, not a way to loosen
# a profile written to be careful.
agent:
  # default asks before risky actions and allows safe ones; auto approves low-risk actions and
  # asks for the rest; read_only allows reads and denies every write and side effect. A default,
  # not a ceiling: `xeac create --mode` overrides it, and a child is clamped against its parent
  # either way.
  permission_mode: default

# How long a finished session stays in the store before it is pruned.
maximum_history_age_days: 30
