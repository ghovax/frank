[project]
name = "agentic-harness"
version = "0.1.0"
description = "Configurable LangChain agent with tools, permissions, sub-agents, and terminal interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.0.0",
    "aiofiles>=24.0.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
agentic-harness = "agentic_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
