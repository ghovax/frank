[project]
name = "daisy"
version = "0.1.0"
description = "Configurable LangChain agent with tools, permissions, and agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "litellm>=1.60.0",
    "langgraph>=1.2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.0.0",
    "exa-py>=2.14.0",
    "tiktoken>=0.8.0",
    "a2a-sdk==0.3.7",
    "pyjwt>=2.8.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.2",
    "watchfiles>=1.2.0",
    "mcp[cli]>=1.27,<2",
    "markdownify>=1.2.2",
    "firecrawl-py>=2.0.0",
    "curl-cffi>=0.15.0",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-json>=0.24",
    "tree-sitter-yaml>=0.7",
    "tree-sitter-toml>=0.6",
    "tree-sitter-bash>=0.23",
    "tree-sitter-html>=0.20",
    "tree-sitter-css>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-markdown>=0.3",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11.0; sys_platform == 'darwin'",
    "playwright>=1.61.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daisy"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
