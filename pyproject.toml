[project]
name = "daisy"
version = "0.1.0"
description = "Configurable LangChain agent with tools, permissions, and sub-agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "litellm>=1.60.0",
    "langgraph>=1.2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.0.0",
    "aiofiles>=24.0.0",
    "exa-py>=2.14.0",
    "a2a-sdk==0.3.7",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.2",
    "watchfiles>=1.2.0",
    "mcp[cli]>=1.27,<2",
    "markdownify>=1.2.2",
    "curl-cffi>=0.15.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
