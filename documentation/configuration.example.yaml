# Every setting Frank has, at the value it ships with.
#
# Do not copy this over ~/.config/frank/configuration.yaml.
#
# Everything here is already the default, so a copy changes nothing today and pins all of it
# tomorrow: a release that improves one of these values would find your file overriding it with
# the old one, from a line nobody remembers writing. That is why the file you actually get on
# first run is nearly empty — it holds only what you supply, and everything else stays where it
# can still move.
#
# What exists, what it ships at, and what this machine currently runs:
#
#     frank configure --all
#
# Set one, read one, put one back:
#
#     frank configure workspace.strategy worktree
#     frank configure workspace.strategy
#     frank configure workspace.strategy --unset
#
# A name that is not in the schema is refused at load rather than written and ignored.


# Credentials

# Each provider also resolves from its own conventional environment variable, which wins over
# anything written here. Which model a session runs is chosen by its agent profile, not here.
# The full list is in frank.base.providers.

providers: {}
  # anthropic:
  #   api_key: ""
  # openai:
  #   api_key: ""

# Exa backs the built-in web search. EXA_API_KEY supplies this instead.
exa:
  api_key: ""

# Optional readers for fetch_url. Without them it falls back to its own extraction.
jina:
  api_key: ""
firecrawl:
  api_key: ""
  # Point at a self-hosted instance; empty means Firecrawl's own.
  api_url: ""
web_fetch:
  # Route page fetches through a proxy — for a site that refuses this machine's address.
  proxy_url: ""


# What a session may do

agent:
  # default | plan | accept_edits | read_only | bypass. A session can be started with its own;
  # this is what it gets when nobody says.
  permission_mode: "default"

# The operating system's answer to "what can this process reach", enforced before the process
# starts rather than checked as it runs. `required` refuses to start a session it cannot confine.
sandbox:
  enforce: "required"
  filesystem:
    # Readable outside the workspace: configuration and toolchains a build genuinely needs.
    readable:
      - "~/.agents"
      - "~/.config"
      - "~/.local"
      - "~/.ssh"
      - "~/.gitconfig"
      - "~/.gitignore_global"
      - "~/.cargo"
      - "~/.rustup"
      - "~/.npmrc"
      - "~/.nvm"
      - "~/.pyenv"
      - "~/.docker"
      - "~/.netrc"
    # Writable. $WORKSPACE is the session's own directory; the rest is scratch.
    writable:
      - "$WORKSPACE"
      - "$TMPDIR"
      - "$XDG_CACHE_HOME"
      - "~/.cache"
    # Denied even where a rule above would have allowed them: personal directories a coding
    # session has no business in, and the mail and message stores behind them.
    deny:
      - "~/Documents"
      - "~/Desktop"
      - "~/Downloads"
      - "~/Pictures"
      - "~/Movies"
      - "~/Music"
      - "~/Library/Mail"
      - "~/Library/Messages"
      - "~/Library/Safari"
  network: true
  # setrlimit, by the constant's own name: no core dumps, 8 GiB per file, 2048 processes.
  limits:
    RLIMIT_CORE: 0
    RLIMIT_FSIZE: 8589934592
    RLIMIT_NPROC: 2048
  # null leaves the inherited umask alone.
  umask: null
  nice: 0

workspace:
  # none | worktree. `worktree` gives each session its own git worktree, so two sessions in one
  # repository cannot tread on each other.
  strategy: "none"


# Keeping a long conversation alive

# When the context fills, the older half is folded into a dense observation log and the recent
# part is kept word for word, rather than the conversation being truncated.

compaction:
  automatic: true
  # When to fold. Late on purpose: a fold rewrites the conversation, which throws away the prompt
  # cache the provider was holding, and held context is cheap by comparison while that cache lasts.
  reclaim_at_fraction: 0.85
  # When the observation log has itself grown large enough to be worth condensing.
  condense_log_at_fraction: 0.3
  # Held back for the answer the model is about to write. Every other fraction here is a share of
  # what is left after it.
  output_reserve_fraction: 0.1
  # How much recent conversation stays verbatim. Tokens rather than turns, because an unattended
  # run is one instruction and several hundred tool results.
  recent_working_set_fraction: 0.25

# An opt-in snapshot of this machine and its habits, offered to the agent at the start of a
# session. Off by default: it is about you, not about the code.
user_context:
  enabled: false


# The tools a session installs for itself. On where the machine has Nix: each session gets a
# package profile of its own at the front of its PATH, so a missing tool is something the agent
# installs rather than a wall it works around. What it installs is deleted with the session, and
# nothing reaches your own profile. Turn it off to keep every session to what the machine has.
toolbox:
  enabled: true


# Driving the screen

computer_control:
  # Opt-in, and it also needs Accessibility granted in System Settings. It drives native macOS
  # apps and your own Chrome — the windows you are working in, not a clean automation target.
  enabled: false

  # After an action a surface is polled until it stops changing, rather than slept on for a fixed
  # guess. A fast page costs one interval; a slow one costs the ceiling.
  settle:
    poll_seconds: 0.05
    give_up_seconds: 1.5

  # How a screen is ranked when a script asks for an element by name.
  #
  # Three signals score every element and are added: two embeddings read what a query *means*, a
  # character similarity reads how it is *spelled*. The models are used together rather than
  # chosen between — alone, the English one is worse on native windows, where a query usually
  # quotes a label that is visible. Clearing a name turns that model off; clearing both leaves
  # BM25, which is also how to get the older single-model ranking back.
  retrieval:
    multilingual_rank_model: "minishlab/M2V_multilingual_output"
    english_rank_model: "minishlab/potion-base-32M"
    # The gate on the character signal. At or below `short`, a query is a quoted label and its
    # spelling is the strongest evidence there is — this is what lets a retyped number, a changed
    # case, or a label the interface truncated still find its element. At or above `long`, a
    # query is a description that shares no spelling with anything, so the signal is dropped
    # rather than left to rank by coincidence. It fades out linearly between the two.
    lexical_gate_short_words: 3
    lexical_gate_long_words: 7

# Speech to text for the composer, on this machine. Apple Silicon only. The weights are not
# bundled and download on first use.
dictation:
  enabled: false
  model: "mlx-community/parakeet-tdt-0.6b-v3"
  timing:
    # The floor on one transcription, plus a multiplier per second of audio. Transcription runs
    # faster than real time here, so reaching the limit means stuck rather than busy.
    minimum_transcription_timeout_seconds: 30.0
    transcription_timeout_realtime_multiplier: 0.5
    maximum_attempts: 2
    worker_shutdown_seconds: 2.0


# Other tools, other machines

# Composio's hosted MCP gateway, as one server.
composio:
  enabled: false
  url: "https://connect.composio.dev/mcp"
  api_key: ""
  server_name: "composio"
  timeout_seconds: 60

# Mirrors what .agents/mcp.json declares and is normally edited there. A folder's servers join
# the shared pool when a session in that folder starts.
mcp:
  servers: {}
    # my-server:
    #   command: "npx"
    #   args: ["-y", "@scope/server"]

# Sessions on other machines, reachable as peers.
remote_agents:
  agents: {}
    # my-peer:
    #   url: "https://…"

telemetry:
  enabled: false
  exporter:
    endpoint: ""
    protocol: "http/protobuf"
    headers: {}
  sample_ratio: 1.0


# Tool budgets and timing
# Size and count caps are token budgets derived from the *live* model context window, so a small
# model gets tight caps and a large one gets room. `context_share` is the proportion of that
# window one result may fill. Timeouts do not depend on the window and answer only to
# `timeout_multiplier` — `2.0` doubles every wait, for a slow machine or link.

tuning:
  context_share:
    # One result's own text: a command's output, a fetched page.
    text: 0.25
    # A set of results: matches, lines, records.
    results: 0.15
  timeout_multiplier: 1.0

  # `defaults` overrides one value by its own name, in its own unit. The names are the members of
  # frank.base.tuning.Tunable; an unknown one is an error at load rather than a line that looks
  # applied and is not. An override replaces what the code *ships* with, so the two knobs above
  # still apply on top of it.
  #
  # `frank configure --all` prints what each is for. The long explanations live as markdown under
  # src/frank/base/tuning_notes/ and are read at runtime, so the code and the reference cannot
  # drift apart.
  defaults:

    # Text budgets, in tokens unless the name says characters.
    output_tokens: 16000
    fetch_tokens: 24000
    maximum_line_chars: 2048
    upstream_error_detail_tokens: 256

    # Listing budgets, in items.
    read_lines: 2000
    grep_results: 512
    grep_per_file: 512
    glob_results: 1000
    web_search_maximum: 10
    remote_listing: 32768

    # What a browser session keeps of the page's own traffic, so a find can surface the API
    # behind a rendered view.
    web_exchanges: 250
    web_websockets: 32
    web_websocket_frames: 200

    # Screen timeouts, in milliseconds.
    action_timeout_ms: 5000
    navigation_timeout_ms: 20000
    snapshot_timeout_ms: 10000
    connect_timeout_ms: 10000
    browser_authorization_ms: 90000
    drag_timeout_ms: 8000
    screenshot_timeout_ms: 20000
    read_text_timeout_ms: 10000
    frame_resolve_timeout_ms: 2000

    # Tool and process timeouts, in seconds.
    sigterm_grace_seconds: 3.0
    ripgrep_seconds: 30.0
    bash_sync_window_seconds: 60.0
    slow_tool_sync_window_seconds: 10.0
    web_search_sync_window_seconds: 10.0
    accessibility_messaging_seconds: 2.0
    control_script_seconds: 120.0
    surface_guard_margin_seconds: 30.0
    screencapture_seconds: 15.0
    open_url_seconds: 5.0

    # Session and daemon lifecycle, in seconds. `session_idle_sleep_seconds` is five hours.
    warm_workers: 2
    prototype_start_seconds: 120.0
    prototype_restart_seconds: 5.0
    session_idle_sleep_seconds: 18000.0
    session_start_seconds: 60.0
    daemon_startup_seconds: 45.0
    control_plane_call_seconds: 60.0
    daemon_probe_interval_seconds: 0.05
    daemon_probe_connect_seconds: 0.5

    # Credentials, subscriptions and links, in seconds.
    model_catalogue_ttl_seconds: 60.0
    credential_refresh_leeway_seconds: 300.0
    oauth_poll_interval_seconds: 1.0
    oauth_poll_ceiling_seconds: 10.0
    oauth_poll_give_up_seconds: 300.0
    subscription_resume_ttl_seconds: 1800.0
    model_silence_give_up_seconds: 180.0
    file_url_ttl_seconds: 600.0
    mcp_connect_seconds: 20.0
    card_resolve_seconds: 20.0

    # Other machines, in seconds.
    remote_command_seconds: 120.0
    remote_connect_seconds: 16.0
    remote_control_persist_seconds: 120.0

    # Synthesised input: how a click, a drag and a keystroke are physically paced.
    type_chunk_size: 20
    type_chunk_interval_seconds: 0.005
    drag_steps: 12
    drag_step_interval_seconds: 0.01
    click_interval_seconds: 0.01
    focus_settle_seconds: 0.03
    scroll_amount_pixels: 300
    settle_stable_reads: 2
    stamped_image_side: 2048

    # Reading an accessibility tree, in seconds.
    accessibility_walk_budget_seconds: 3.0
    accessibility_ready_probe_seconds: 0.4
    accessibility_prewarm_interval_seconds: 0.4
    accessibility_ready_backoff_seconds: 0.2

    # Finding an element on a screen. `find_one_margin` is how far ahead of the runner-up the
    # best match must score, in units of the shortlist's own spread, before it answers instead of
    # asking which was meant — it is fitted against the ranking configured above, so changing one
    # means re-fitting the other. `find_relevance_floor` is a plain cosine and stays one
    # deliberately: a fused score is scaled by the query's own length and means nothing between
    # calls.
    find_rephrasing_similarity: 0.45
    find_near_weight: 0.5
    find_anchor_margin: 0.02
    find_candidates: 5
    find_one_margin: 0.2
    find_many_ceiling: 50
    find_relevance_floor: 0.25
