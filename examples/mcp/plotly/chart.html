<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
    #chart { flex: 1; min-height: 0; }
    #error { display: none; padding: 12px; color: #b42318; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div id="error"></div>
  <script type="application/json" id="chart-data">__CHART_DATA_JSON__</script>
  <script>
    const data = JSON.parse(document.getElementById("chart-data").textContent);
    const config = Object.assign({ responsive: true, displaylogo: false }, data.config || {});

    function postEvent(event, payload) {
      window.parent.postMessage({
        source: "harness-widget",
        artifactId: data.chart_id,
        event: event,
        data: payload
      }, "*");
    }

    // Surface a render failure both in the iframe and — as structured data — back
    // to the agent, so it can read the error and fix the figure.
    function reportError(message) {
      const node = document.getElementById("error");
      node.style.display = "block";
      node.textContent = "Failed to render chart: " + message;
      postEvent("render_error", { message: String(message) });
    }

    window.addEventListener("unhandledrejection", (rejectionEvent) => {
      reportError((rejectionEvent.reason && rejectionEvent.reason.message) || String(rejectionEvent.reason));
    });

    Plotly.newPlot("chart", data.traces || [], data.layout || {}, config)
      .then((graphDiv) => {
        // Forward point clicks back to the agent as a structured interaction.
        graphDiv.on("plotly_click", (eventData) => {
          const points = (eventData.points || []).map((point) => ({
            curve: point.curveNumber,
            point: point.pointNumber,
            trace: point.data && point.data.name,
            x: point.x,
            y: point.y,
            label: point.label,
            value: point.value
          }));
          postEvent("point_click", { points });
        });
      })
      .catch((error) => reportError(error && error.message ? error.message : String(error)));
  </script>
</body>
</html>
