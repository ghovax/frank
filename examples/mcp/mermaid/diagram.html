<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
    /* The diagram fills the frame; svg-pan-zoom handles fit, pan, and zoom so
       large diagrams are never clipped. */
    #diagram { flex: 1; min-height: 0; overflow: hidden; }
    #diagram svg { width: 100%; height: 100%; display: block; }
    #error { display: none; padding: 12px; color: #b42318; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="diagram"></div>
  <div id="error"></div>
  <script type="application/json" id="diagram-data">__DIAGRAM_DATA_JSON__</script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    const data = JSON.parse(document.getElementById("diagram-data").textContent);

    function postEvent(event, payload) {
      window.parent.postMessage({
        source: "harness-widget",
        artifactId: data.diagram_id,
        event: event,
        data: payload
      }, "*");
    }

    // Surface a render failure both in the iframe and — as structured data — back
    // to the agent, so it can read the parser error and fix the definition.
    function reportError(message) {
      const node = document.getElementById("error");
      node.style.display = "block";
      node.textContent = "Failed to render diagram: " + message;
      postEvent("render_error", { message: String(message) });
    }

    // Render without the default max-width cap so svg-pan-zoom controls sizing.
    mermaid.initialize({ startOnLoad: false, theme: data.theme || "default", flowchart: { useMaxWidth: false } });

    try {
      await mermaid.parse(data.definition);
      const { svg } = await mermaid.render(`diagram-${data.diagram_id}`, data.definition);
      const container = document.getElementById("diagram");
      container.innerHTML = svg;
      const svgElement = container.querySelector("svg");
      if (svgElement) {
        svgElement.style.maxWidth = "none";
        svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          fit: true,
          center: true,
          minZoom: 0.1,
          maxZoom: 20
        });
      }
    } catch (error) {
      reportError(error && error.message ? error.message : String(error));
    }
  </script>
</body>
</html>
