# The file XEAC creates at ~/.config/xeac/configuration.yaml on first run.
#
# Deliberately almost empty. Every setting has a default in the code, and a seed that restated
# those defaults would freeze them: a later release could improve one and every existing
# installation would keep overriding it with a copy of the old value, from a line nobody
# remembers writing. So this holds only what a person genuinely has to supply — a key for the
# provider they use — and everything else stays where it can still move.
#
# To see what there is to change:   xeac configure --all
# To change one:                    xeac configure daemon.warm_floor 4
# To read one:                      xeac configure daemon.warm_floor
# To put it back:                   xeac configure daemon.warm_floor --unset
#
# A name that is not in the schema is refused rather than written and ignored.

# Model provider credentials. Each also resolves from that provider's conventional environment
# variable, which wins over anything written here. Which model a session runs is chosen by its
# agent profile, not here. The full provider list is in xeac.base.providers.
providers:
  anthropic:
    api_key: ""
  openai:
    api_key: ""
  google:
    api_key: ""
  openrouter:
    api_key: ""
  xai:
    api_key: ""

# Exa backs the built-in web search. EXA_API_KEY can supply this instead.
exa:
  api_key: ""
