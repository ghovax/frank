# Provider keys resolve in this order: this file first, then the provider's
# conventional environment variable. First-party providers use LiteLLM's built-in
# endpoints. OpenAI-compatible providers can also declare a base_url.
providers:
  opencode:
    api_key: ""
    base_url: "https://opencode.ai/zen/go/v1"
  anthropic:
    api_key: ""
  openai:
    api_key: ""
  google:
    api_key: ""
  openrouter:
    api_key: ""
  xai:
    api_key: ""
  deepseek:
    api_key: ""
  groq:
    api_key: ""
  mistral:
    api_key: ""
  custom:
    api_key: ""
    base_url: ""

# Exa powers the built-in web_search fallback. EXA_API_KEY can also provide this.
exa:
  api_key: ""

# Composio is exposed as a normal MCP server when enabled. COMPOSIO_API_KEY can
# also provide the key.
composio:
  enabled: false
  url: "https://connect.composio.dev/mcp"
  api_key: ""
  server_name: "composio"

# sandbox.enabled confines bash tools to the active workspace unless the user
# grants permission. workspace.strategy controls optional branch/worktree setup.
sandbox:
  enabled: true

workspace:
  strategy: "none"

# Directory roots are fixed in code: ~/.agents globally and .agents inside the
# selected working directory. Only the default primary agent is configurable.

# How large, how many, and how patient the tools are. Size and count caps are token
# budgets that scale with the live model context window (a small model gets tighter
# caps, a large one more room); these two fractions move the whole output/listing
# family up or down from the calibrated defaults. Timeouts scale only with
# timeout_scale. Settlement is not a fixed sleep: after an action a surface is polled
# until it stops changing, bounded by the interval and ceiling below.
tuning:
  # Share of the context window one tool's textual output may fill (read windows,
  # command output, fetched pages, evaluate results). Higher = larger inline outputs.
  output_fraction: 0.25
  # Share of the window a structured listing may fill (page elements, find matches,
  # grep/glob results, file lines). Higher = longer listings.
  listing_fraction: 0.15
  # How often to re-check whether a surface has settled after an action, in seconds.
  settle_interval_seconds: 0.05
  # The longest to wait for a surface to settle before proceeding anyway, in seconds.
  settle_ceiling_seconds: 1.5
  # Multiplier on every action, navigation, and IO timeout. Raise on a slow machine
  # or link, lower to fail faster.
  timeout_scale: 1.0
