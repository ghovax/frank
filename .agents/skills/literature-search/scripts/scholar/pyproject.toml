[project]
name = "scholar"
version = "0.1.0"
description = "Multi-source scholarly literature engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2",
    "beautifulsoup4>=4",
    "lxml>=5",
    "PyMuPDF>=1.23",
    "Pillow>=10",
    "habanero>=1.2",
    "pyalex>=0.12",
    "semanticscholar>=0.6",
    "arxiv>=2.1",
    "biopython>=1.83",
    "numpy>=1.26",
    "mistletoe>=1.3",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
