[project]
name = "blackboard"
version = "0.1.0"
description = "Durable, append-only evidence blackboard: parse documents and query them with SQL"
requires-python = ">=3.10"
dependencies = [
    # Hosted document parsing (Datalab/Marker) and faithful HTML-to-text.
    "datalab-python-sdk>=0.5",
    "markdownify>=1.2",
    # LLM/VLM enrichment (citation extraction, figure descriptions).
    "litellm>=1.60",
    # Structured-output schemas for the enrichment calls.
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
