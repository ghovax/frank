[package]
name = "daisy"
version = "0.1.0"
description = "Daisy desktop app — native shell for the Daisy chat UI"
authors = ["ghovax"]
edition = "2021"
default-run = "daisy"
rust-version = "1.77.2"

# The Rust code compiles to a library so the same `run()` entry point is shared by
# the desktop binary (main.rs) and mobile builds.
[lib]
name = "daisy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
