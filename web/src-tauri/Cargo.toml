[package]
name = "daisy"
version = "0.1.0"
description = "Daisy desktop app — native shell for the Daisy chat UI"
authors = ["ghovax"]
edition = "2021"
default-run = "daisy"
rust-version = "1.77.2"

# The Rust code compiles to a library so the same `run()` entry point is shared by
# the desktop binary (main.rs) and mobile builds.
[lib]
name = "daisy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is required for the multiwebview API (Window::add_child) used to embed
# the native website-preview webview inside the main window.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
# The front-end-local store (saved connection profiles, UI prefs) lives in its own
# SQLite database, separate from the harness server's history.db.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
