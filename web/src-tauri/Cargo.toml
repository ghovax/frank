[package]
name = "xeac"
version = "0.1.0"
description = "XEAC desktop app — native shell for the XEAC session UI"
authors = ["ghovax"]
edition = "2021"
default-run = "XEAC"
rust-version = "1.77.2"

# The binary is named "XEAC" (capitalized) so the built executable — and therefore
# CFBundleExecutable — reads "XEAC". The macOS Automation / Apple-Events permission prompt
# shows the sending process's executable name, so a lowercase "xeac" there would not match
# the "XEAC" the Accessibility pane shows; naming the binary properly keeps both consistent.
[[bin]]
name = "XEAC"
path = "src/main.rs"

# The Rust code compiles to a library so the same `run()` entry point is shared by
# the desktop binary (main.rs) and mobile builds.
[lib]
name = "xeac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is required for the multiwebview API (Window::add_child) used to embed
# the native website-preview webview inside the main window.
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
# The front-end-local store (saved connection profiles, UI prefs) lives in its own
# SQLite database, separate from the harness server's history.db.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# The native file picker — lets the user attach a local file by its real OS path so it
# can be referenced in place (no copy). Drag-drop needs no plugin (webview core event).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Low-level spawn control: the bundled server is launched "disclaimed" (its own TCC
# responsible process) so the macOS Accessibility grant applies to it, not the app.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSSound"] }
